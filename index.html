<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WabiSabi</title>
<meta name="description" content="Tienda en línea de WabiSabi: sublimaciones, estampados, tazas, llaveros, arreglos y paquetes de grado.">
<meta name="theme-color" content="#00145E">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
img{max-width:100%}[hidden]{display:none!important}

/* Layout: banda de aviso, cabecera fija navy, hero con accesos por categoría, catálogo en cuadrícula, carrito lateral en 3 pasos, panel de edición solo para el dueño */
:root{
  --navy:#00145E; --amber:#FCBA00;
  --bg:#F5F6FB; --surface:#FFFFFF; --fg:#0A1440; --muted:#59618A; --line:#DCE0F2;
  --soft:#FFF3CC; --tile:#E9ECFA; --ok:#1B7A4B; --danger:#B3261E; --ring:#00145E;
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-b:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050B2B; --surface:#0C1745; --fg:#F3F4FF; --muted:#A5ACD8; --line:#1F2C6E;
  --soft:#2A2A12; --tile:#16215A; --ok:#4CC38A; --danger:#FF8A80; --ring:#FCBA00; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050B2B; --surface:#0C1745; --fg:#F3F4FF; --muted:#A5ACD8; --line:#1F2C6E;
  --soft:#2A2A12; --tile:#16215A; --ok:#4CC38A; --danger:#FF8A80; --ring:#FCBA00; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-b);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.in{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--amber);color:var(--navy);text-decoration:none;min-height:44px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.btn.navy{background:var(--navy);color:#fff}
.btn.sm{padding:8px 14px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.wa{background:#25D366;color:#06301a}
.bar{background:var(--amber);color:var(--navy);font-size:14px;font-weight:700;text-align:center;padding:8px 0}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:#fff}
.hdr .in{display:flex;align-items:center;gap:14px;padding-block:8px;flex-wrap:wrap}
.logo{height:46px;width:auto;display:block}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;border:0;border-radius:999px;padding:11px 16px;background:#fff;color:#0A1440;min-height:44px}
.cartbtn{position:relative;background:var(--amber);color:var(--navy);border:0;border-radius:999px;min-height:44px;padding:0 18px;font-weight:700;display:flex;align-items:center;gap:8px;margin-left:auto}
.cartbtn .n{background:var(--navy);color:var(--amber);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.hero{background:var(--navy);color:#fff;padding-block:40px 48px}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,60px);color:var(--amber);font-weight:700}
.hero p{max-width:46ch;color:#D9DEFA;margin:16px 0 24px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:rgba(255,255,255,.08);border:2px solid rgba(252,186,0,.55);border-radius:18px;color:#fff;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;text-align:center;min-width:0}
.tile:hover{background:var(--amber);color:var(--navy)}
.tile svg{width:38px;height:38px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--fg);min-height:40px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--amber)}
.sec{padding-block:28px}
.sec h2{font-size:clamp(26px,4vw,36px);margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;background:var(--tile);display:grid;place-items:center;position:relative;color:var(--navy)}
:root[data-theme="dark"] .ph,:root:not([data-theme="light"]) .ph{}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:46%;height:46%;color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ph svg{color:var(--amber)}}
:root[data-theme="dark"] .ph svg{color:var(--amber)}
.badge{position:absolute;top:10px;left:10px;background:var(--amber);color:var(--navy);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card h3{font-size:19px}
.desc{color:var(--muted);font-size:14px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.price{font-family:var(--font-d);font-size:24px;font-weight:700}
.price small{display:block;font-family:var(--font-b);font-size:12px;color:var(--muted);font-weight:500}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;list-style:none;padding:0;margin:0}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.steps b{display:block;font-family:var(--font-d);font-size:20px;margin-bottom:4px}
.steps span{color:var(--muted);font-size:15px}
.foot{background:var(--navy);color:#D9DEFA;padding-block:32px;margin-top:24px}
.foot .in{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.foot h3{color:var(--amber);font-size:20px;margin-bottom:8px}
.foot dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.foot dt{color:var(--amber);font-weight:700}
.foot dd{margin:0;word-break:break-word;min-width:0}
.foot a{color:#fff}
.ov{position:fixed;inset:0;background:rgba(5,11,43,.6);z-index:70;display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(480px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
.ph1{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.ph1 h2{font-size:22px;color:var(--amber);flex:1}
.x{background:transparent;border:0;color:#fff;font-size:28px;line-height:1;min-width:44px;min-height:44px}
.pb{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pf{border-top:1px solid var(--line);background:var(--surface);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;gap:10px}
.tot b{font-family:var(--font-d);font-size:26px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.line .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.line .nm{font-weight:700;min-width:0}
.qty{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px}
.qty button{border:0;background:transparent;width:36px;height:36px;font-size:20px;font-weight:700;border-radius:999px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.fld input,.fld textarea,.fld select{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:400;min-height:44px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opts label{flex:1 1 140px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-weight:700;background:var(--surface)}
.err{color:var(--danger);font-weight:700;font-size:14px;margin:0}
.pm{background:var(--soft);border:2px solid var(--amber);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pm h3{font-size:20px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kv span{color:var(--muted);font-size:14px}
.kv b{font-size:17px;word-break:break-all}
.cp{border:2px solid var(--navy);background:transparent;color:var(--navy);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;min-height:32px}
:root[data-theme="dark"] .cp{color:var(--amber);border-color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cp{color:var(--amber);border-color:var(--amber)}}
.note{font-size:14px;color:var(--muted);margin:0}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:200;font-weight:700;max-width:calc(100% - 32px);text-align:center;border:2px solid var(--amber)}
.edit-fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--danger);display:inline-block}
.tabs{display:flex;gap:8px}
.ap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ap>button.hd{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:10px;text-align:left}
.ap .th{width:46px;height:46px;border-radius:10px;background:var(--tile);overflow:hidden;display:grid;place-items:center;flex:0 0 auto;color:var(--navy)}
.ap .th img{width:100%;height:100%;object-fit:cover}
.ap .th svg{width:26px;height:26px}
.ap .ti{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap .bd{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.hint{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
#loader{position:fixed;inset:0;background:var(--navy);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s}
#loader.out{opacity:0;pointer-events:none}
#loader img{width:min(240px,60vw);height:auto;animation:bob 1.1s ease-in-out infinite}
#loader i{display:block;width:120px;height:6px;border-radius:6px;background:rgba(252,186,0,.25);overflow:hidden;position:relative}
#loader i::after{content:"";position:absolute;inset:0;width:40%;background:var(--amber);border-radius:6px;animation:slide 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes slide{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){#loader img,#loader i::after{animation:none}html{scroll-behavior:auto}.btn:hover{transform:none}}
@media (max-width:760px){
  .hero .in{grid-template-columns:1fr}
  .foot .in{grid-template-columns:1fr}
  .nav{top:calc(env(safe-area-inset-top,0px) + 112px)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cb{padding:10px}
  .card h3{font-size:16px}
  .price{font-size:20px}
  .row2{grid-template-columns:1fr}
}

/* editor: secciones separadas y campos con más contraste */
:root{--ico:#00145E;--field:#FFFFFF;--fline:#B7BFE3;--sect:#EEF0FA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ico:#FCBA00;--field:#16215F;--fline:#4A5BB0;--sect:#101B50}}
:root[data-theme="dark"]{--ico:#FCBA00;--field:#16215F;--fline:#4A5BB0;--sect:#101B50}
.panel .fld input,.panel .fld textarea,.panel .fld select,.panel input[data-cf]{background:var(--field);border:2px solid var(--fline)}
.pb h3{font-size:13px;font-family:var(--font-b);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);border-top:2px solid var(--line);padding-top:16px;margin-top:8px}
.ap{border:2px solid var(--fline);border-radius:16px}
.ap.open{border-color:var(--amber)}
.ap>button.hd{padding:12px;gap:12px}
.ap .th{color:var(--ico);border:1px solid var(--fline)}
.ap .th.big{width:76px;height:76px}
.ap .th.big svg{width:38px;height:38px}
.ap .bd{padding:0;gap:0}
.sc{padding:16px 14px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.sc:nth-child(even){background:var(--sect)}
.sc>h4{margin:0;font:700 12px/1 var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.phrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phrow .fld{flex:1 1 180px;min-width:0}
.sc .btns{display:flex;gap:10px;flex-wrap:wrap}
.row2.keep{grid-template-columns:1fr 1fr}
.ev{display:flex;flex-direction:column;gap:12px}
.pb>*{flex-shrink:0}
.ap>button.hd{min-height:72px}
.ap .th{width:54px;height:54px}
.ap .th svg{width:30px;height:30px}
.ap .ti small{display:block;font-weight:400;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.ap .go{font-size:13px;font-weight:700;color:var(--ico);white-space:nowrap}
</style>
</head>

function icon(k){return '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[k]||ICONS.gift)+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '$'+(Number(n)||0).toFixed(2).replace('.',',');}
function bs(n){var t=Number(S.settings.tasa)||0;if(t<=0)return '';return (n*t).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})+' Bs';}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function byId(id){return S.products.filter(function(p){return p.id===id;})[0];}
function catOf(id){return S.categories.filter(function(c){return c.id===id;})[0]||{name:'',icon:'gift'};}

var ui={editId:null,login:false,loginErr:'',cat:'all',q:'',cartOpen:false,step:'cart',admin:false,tab:'prods',open:{},dirty:false,owner:false,delId:null,err:'',saving:false,code:''};

var cart=[];
try{cart=JSON.parse(localStorage.getItem('ws_cart')||'[]');}catch(e){cart=[];}
function saveCart(){try{localStorage.setItem('ws_cart',JSON.stringify(cart));}catch(e){}}
function cleanCart(){cart=cart.filter(function(i){var p=byId(i.id);return p&&p.stock!==false&&i.qty>0;});}
function count(){return cart.reduce(function(a,i){return a+i.qty;},0);}
function subtotal(){return cart.reduce(function(a,i){var p=byId(i.id);return a+(p?p.price*i.qty:0);},0);}

function lock(){document.body.style.overflow=(ui.cartOpen||ui.admin||ui.login)?'hidden':'';}

function cardHTML(p){
  var c=catOf(p.cat);var out=p.stock===false;
  var im=p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy">':icon(c.icon);
  var b=out?'<span class="badge">Agotado</span>':(p.badge?'<span class="badge">'+esc(p.badge)+'</span>':'');
  var bsv=bs(p.price);
  return '<article class="card"><div class="ph">'+im+b+'</div><div class="cb"><span class="cat">'+esc(c.name)+'</span><h3>'+esc(p.name)+'</h3><p class="desc">'+esc(p.desc)+'</p><div class="pr"><div class="price">'+money(p.price)+(bsv?'<small>'+esc(bsv)+'</small>':'')+'</div><button class="btn sm" data-act="add" data-id="'+esc(p.id)+'"'+(out?' disabled':'')+'>'+(out?'Agotado':'Agregar')+'</button></div></div></article>';
}
function renderGrid(){
  var q=ui.q.trim().toLowerCase();
  var list=S.products.filter(function(p){
    if(ui.cat!=='all'&&p.cat!==ui.cat)return false;
    if(q&&(p.name+' '+p.desc+' '+catOf(p.cat).name).toLowerCase().indexOf(q)<0)return false;
    return true;});
  var g=document.getElementById('grid');if(!g)return;
  g.innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty" style="grid-column:1/-1">No encontramos productos con esa búsqueda. Prueba con otra palabra o escríbenos por WhatsApp para pedirlo a medida.</div>';
}
function renderChips(){
  var el=document.getElementById('chips');if(!el)return;
  var h='<button class="chip" data-act="cat" data-id="all" aria-pressed="'+(ui.cat==='all')+'">Todo</button>';
  S.categories.forEach(function(c){h+='<button class="chip" data-act="cat" data-id="'+esc(c.id)+'" aria-pressed="'+(ui.cat===c.id)+'">'+esc(c.name)+'</button>';});
  el.innerHTML=h;
}

function renderCart(){
  if(!ui.cartOpen){$cart.innerHTML='';lock();return;}
  var s=S.settings,sub=subtotal(),bsv=bs(sub),title,body='',foot='';

    title='Tu carrito';
    if(!cart.length){body='<div class="empty">Tu carrito está vacío. Agrega productos desde el catálogo.</div>';foot='<button class="btn" data-act="closecart">Seguir comprando</button>';}
    else{
      cart.forEach(function(i){var p=byId(i.id);if(!p)return;
        body+='<div class="line"><div class="top"><div class="nm">'+esc(p.name)+'<div class="note">'+money(p.price)+' c/u</div></div><b>'+money(p.price*i.qty)+'</b></div><div class="top"><div class="qty"><button data-act="dec" data-id="'+esc(p.id)+'" aria-label="Quitar uno">−</button><span>'+i.qty+'</span><button data-act="inc" data-id="'+esc(p.id)+'" aria-label="Agregar uno">+</button></div><button class="btn ghost sm" data-act="rm" data-id="'+esc(p.id)+'">Quitar</button></div><label class="fld">Detalles del diseño<textarea data-note="'+esc(p.id)+'" placeholder="Nombre, texto, colores, fecha, foto a enviar…">'+esc(i.note||'')+'</textarea></label></div>';});
      foot='<div class="tot"><span>Subtotal</span><span><b>'+money(sub)+'</b>'+(bsv?'<div class="note">≈ '+esc(bsv)+'</div>':'')+'</span></div><button class="btn" data-act="tostep" data-id="datos">Continuar</button>';
    }
  }else if(ui.step==='datos'){
    title='Tus datos';

/* guardar cambios en GitHub (data.json) */
var gh={repo:'',branch:'main',token:''};
try{var g0=JSON.parse(localStorage.getItem('ws_gh')||'{}');gh.repo=g0.repo||'';gh.branch=g0.branch||'main';gh.token=g0.token||'';}catch(e){}
function saveGh(){try{localStorage.setItem('ws_gh',JSON.stringify(gh));}catch(e){}}
function ghField(k,l,type){return '<label class="fld">'+l+'<input data-gh="'+k+'" type="'+(type||'text')+'" value="'+esc(gh[k])+'" autocomplete="off" autocapitalize="none"></label>';}
function b64(s){var by=new TextEncoder().encode(s),o='';for(var i=0;i<by.length;i+=8192)o+=String.fromCharCode.apply(null,by.subarray(i,i+8192));return btoa(o);}
function downloadData(){var bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='data.json';document.body.appendChild(a);a.click();a.remove();}
async function publish(){
  ui.err='';
  if(!gh.repo||!gh.token){ui.err='Primero conecta GitHub en Ajustes (repositorio y token).';ui.tab='sett';renderAdmin();return;}
  ui.saving=true;renderAdmin();
  var api='https://api.github.com/repos/'+gh.repo+'/contents/data.json';
  var H={'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  var br=gh.branch||'main';
  try{
    var r=await fetch(api+'?ref='+encodeURIComponent(br),{headers:H,cache:'no-store'});
    var sha=null;
    if(r.ok){sha=(await r.json()).sha;}else if(r.status!==404){throw {status:r.status};}
    var body={message:'Actualizar tienda desde el editor',content:b64(JSON.stringify(S,null,1)),branch:br};
    if(sha)body.sha=sha;
    var w=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
    if(!w.ok)throw {status:w.status};
    ui.saving=false;ui.dirty=false;renderFab();renderAdmin();toast('Guardado en GitHub. La tienda se actualiza en 1 o 2 minutos.');
  }catch(e){
    ui.saving=false;var c=e&&e.status;
    ui.err=(c===401)?'El token no es válido o venció. Crea uno nuevo en GitHub.':(c===403)?'El token no tiene permiso para escribir en este repositorio.':(c===404)?'No se encontró el repositorio o la rama. Revisa el nombre (usuario/repositorio).':(c===409||c===422)?'GitHub pidió reintentar. Toca Publicar cambios otra vez.':'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
    renderAdmin();
  }
}
function resizeImg(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var max=600,k=Math.min(1,max/Math.max(im.width,im.height));
    var cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
    var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',0.8));};im.onerror=function(){toast('No se pudo leer esa imagen');};im.src=r.result;};
  r.readAsDataURL(file);
}

/* acceso al modo edición */
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
async function doLogin(){
  var u=(document.getElementById('lu')||{}).value||'',p=(document.getElementById('lp')||{}).value||'';
  try{
    var h=await sha(u.trim().toLowerCase()+':'+p);
    if(h===S.settings.auth){ui.owner=true;ui.login=false;ui.admin=true;ui.loginErr='';renderFab();renderAdmin();}
    else{ui.loginErr='Usuario o clave incorrectos.';renderAdmin();}
  }catch(e){ui.loginErr='Este navegador no pudo validar el acceso.';renderAdmin();}
}
async function setAuth(){
  var u=((document.getElementById('nu')||{}).value||'').trim().toLowerCase(),p=(document.getElementById('np')||{}).value||'';
  if(u.length<3||p.length<6){toast('Usuario de 3 o más letras y clave de 6 o más caracteres');return;}
  try{S.settings.auth=await sha(u+':'+p);markDirty();toast('Acceso cambiado. Publica los cambios para guardarlo');}catch(e){toast('No se pudo cambiar el acceso');}
}

  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');

  switch(act){

    case 'add':{var p=byId(id);if(!p||p.stock===false)break;var f=cart.filter(function(i){return i.id===id;})[0];if(f)f.qty++;else cart.push({id:id,qty:1,note:''});saveCart();updateBadge();toast(p.name+' agregado al carrito');break;}
    case 'opencart':cleanCart();ui.cartOpen=true;ui.step='cart';renderCart();break;
    case 'closecart':ui.cartOpen=false;renderCart();break;
    case 'inc':cart.forEach(function(i){if(i.id===id)i.qty++;});saveCart();updateBadge();renderCart();break;
    case 'dec':cart.forEach(function(i){if(i.id===id)i.qty--;});cleanCart();saveCart();updateBadge();renderCart();break;
    case 'rm':cart=cart.filter(function(i){return i.id!==id;});saveCart();updateBadge();renderCart();break;
    case 'tostep':ui.step=id;ui.err='';renderCart();break;
    case 'topay':{
      var digits=cust.phone.replace(/\D/g,'');
      if(cust.name.trim().length<3)ui.err='Escribe tu nombre y apellido.';
      else if(digits.length<7)ui.err='Escribe un teléfono válido para contactarte.';
      else if(cust.mode==='delivery'&&cust.addr.trim().length<8)ui.err='Escribe la dirección de entrega.';
      else ui.err='';
      if(ui.err){renderCart();break;}
      ui.code='WS-'+Date.now().toString(36).slice(-5).toUpperCase();ui.step='pago';renderCart();break;}
    case 'clearcart':cart=[];saveCart();updateBadge();ui.cartOpen=false;renderCart();toast('Carrito vaciado. ¡Gracias por tu compra!');break;
    case 'openadmin':ui.admin=true;renderAdmin();break;
    case 'closeadmin':ui.admin=false;renderAdmin();break;
    case 'tab':ui.tab=id;renderAdmin();break;
    case 'togp':ui.editId=id;ui.delId=null;renderAdmin();break;
    case 'backlist':ui.editId=null;ui.delId=null;renderAdmin();break;
    case 'addp':{var n={id:uid(),name:'Nuevo producto',cat:S.categories[0]?S.categories[0].id:'',price:1,desc:'',img:'',badge:'',stock:true};S.products.unshift(n);ui.editId=n.id;markDirty();renderAdmin();renderGrid();break;}
    case 'delp1':ui.delId=id;renderAdmin();break;
    case 'delp0':ui.delId=null;renderAdmin();break;
    case 'delp2':S.products=S.products.filter(function(p){return p.id!==id;});ui.delId=null;ui.editId=null;cleanCart();saveCart();markDirty();renderAdmin();renderGrid();updateBadge();break;
    case 'rmimg':{var q=byId(id);if(q)q.img='';markDirty();renderAdmin();renderGrid();break;}
    case 'addc':S.categories.push({id:'c'+Date.now().toString(36),name:'Nueva categoría',icon:'gift'});markDirty();renderAdmin();renderPage();break;
    case 'delc':S.categories=S.categories.filter(function(c){return c.id!==id;});if(ui.cat===id)ui.cat='all';markDirty();renderAdmin();renderPage();break;
    case 'login':ui.login=true;ui.loginErr='';renderAdmin();break;
    case 'closelogin':ui.login=false;renderAdmin();break;
    case 'dologin':doLogin();break;
    case 'logout':ui.owner=false;ui.admin=false;renderFab();renderAdmin();toast('Sesión cerrada');break;
    case 'setauth':setAuth();break;
    case 'dl':downloadData();break;
    case 'retry':loadData();break;
    case 'publish':publish();break;
  }
});
document.addEventListener('input',function(e){

  if(t.hasAttribute('data-gh')){gh[t.getAttribute('data-gh')]=t.value.trim();saveGh();return;}

  if(t.hasAttribute('data-c')&&t.type!=='radio'){cust[t.getAttribute('data-c')]=t.value;return;}
  if(t.hasAttribute('data-note')){cart.forEach(function(i){if(i.id===t.getAttribute('data-note'))i.note=t.value;});saveCart();return;}
  if(t.hasAttribute('data-pf')&&t.type!=='checkbox'&&t.tagName!=='SELECT'){var p=byId(t.getAttribute('data-id'));if(!p)return;var f=t.getAttribute('data-pf');p[f]=(f==='price')?(parseFloat(t.value)||0):t.value;markDirty();return;}
  if(t.hasAttribute('data-sf')){var k=t.getAttribute('data-sf');S.settings[k]=(k==='tasa')?(parseFloat(t.value)||0):t.value;markDirty();return;}
  if(t.hasAttribute('data-cf')){S.categories.forEach(function(c){if(c.id===t.getAttribute('data-cf'))c.name=t.value;});markDirty();return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute('data-c')==='mode'){cust.mode=t.value;renderCart();return;}
  if(t.hasAttribute('data-pf')){var p=byId(t.getAttribute('data-id'));if(p){var f=t.getAttribute('data-pf');if(f==='stock')p.stock=t.checked;else if(f==='cat')p.cat=t.value;markDirty();}renderGrid();renderAdmin();return;}
  if(t.hasAttribute('data-img')&&t.files&&t.files[0]){var id=t.getAttribute('data-img');resizeImg(t.files[0],function(url){var p=byId(id);if(p){p.img=url;markDirty();renderAdmin();renderGrid();}});return;}
  if(t.hasAttribute('data-sf')||t.hasAttribute('data-cf')){renderPage();renderAdmin();}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='lu'||e.target.id==='lp')){doLogin();return;}if(e.key==='Escape'){if(ui.login){ui.login=false;renderAdmin();}else if(ui.cartOpen){ui.cartOpen=false;renderCart();}else if(ui.admin){ui.admin=false;renderAdmin();}}});

function boot(){cleanCart();renderPage();renderCart();renderAdmin();renderFab();}
function loadData(){
  return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http');return r.json();}).then(function(d){S=d;boot();}).catch(function(){
    $page.innerHTML='<div class="in" style="padding-block:60px;text-align:center"><h2>No pudimos cargar la tienda</h2><p class="sub">Revisa tu conexión e intenta de nuevo.</p><button class="btn" data-act="retry">Reintentar</button></div>';
  });
}
loadData().then(function(){if(document.readyState==='complete')hideLoader();else window.addEventListener('load',hideLoader);});
setTimeout(function(){if(document.getElementById('loader'))hideLoader();},8000);
})();
</script>
</body>
</html>
